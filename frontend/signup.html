<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaBoard - Sign Up</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/header_footer.css">
    <link rel="stylesheet" href="./css/auth.css">
    <script src="./js/global/navbar-footer-inject.js" type="module"></script>
    <script src="./js/signup.js" type="module" defer></script>
</head>

<body>
    <div id="navbar_container"></div>

    <main class="form_container">
        <div class="backendFeedback hidden" id="signUpMessage">
            <p id="feedbackMessage"></p>
        </div>
        <form class="form shadow-xl" id="signUpForm">

            <div class="form_header">

                <h1>
                    Create an account
                </h1>

                <p class="form_footer_text">
                    Anyone in the ABC College community can sign up. Already have an account?
                    <span> <a href="./login.html" class="form_link">Sign in</a></span>
                </p>

            </div>

            <div class="form_details">

                <div class="form_one_row">

                    <label for="firstname" class="form_label">First Name
                        <input type="text" name="firstname" id="firstname" placeholder="First Name" class="form_input">
                    </label>

                    <label for="lastname" class="form_label">First Name
                        <input type="text" name="lastname" id="lastname" placeholder="Last Name" class="form_input">
                    </label>

                </div>

                <span class="error" data-for="firstname"></span>
                <span class="error" data-for="lastname"></span>

                <label for="email" class="form_label">Email</label>
                <input type="email" name="email" id="email" placeholder="username@email.com" class="form_input">
                <span class="error" data-for="email"></span>
                <label for="password" class="form_label">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password"
                    class="form_input">
                <span class="error" data-for="password"></span>

                <label for="cpassword" class="form_label"> Confirm Password</label>
                <input type="password" name="cpassword" id="cpassword" placeholder="Retype your password"
                    class="form_input">
                <span class="error" id="cpasswordError" data-for="cpassword"></span>

            </div>

            <div class="form_footer">
                <button type="button" class="form_button disabled" id="signUpButton" disabled>
                    Create Account
                </button>
            </div>

        </form>

    </main>

    <div id="footer_container"></div>
</body>

</html>
