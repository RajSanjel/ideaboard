<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaBoard - Login</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/header_footer.css">
    <link rel="stylesheet" href="./css/auth.css">
    <script src="./js/global/navbar-footer-inject.js" type="module"></script>
    <script src="./js/login.js" type="module"></script>
</head>

<body>
    <div id="navbar_container"></div>

    <main class="form_container">
        <div class="backendFeedback hidden" id="signUpMessage">
            <p id="feedbackMessage"></p>
        </div>
        <form class="form shadow-xl" id="loginForm">
            <div class="form_header">
                <h1>
                    Sign in to IdeaBoard
                </h1>
                <p>
                    Use your IdeaBoard account to post and follow suggestions for ABC College.
                </p>
            </div>

            <div class="form_details">
                <label for="email" class="form_label">Email</label>
                <input type="email" name="email" id="email" placeholder="username@email.com" class="form_input">
                <span class="error" data-for="email"></span>
                <label for="password" class="form_label">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password"
                    class="form_input">
                <span class="error" data-for="password"></span>
            </div>
            <div class="form_footer">
                <button type="button" class="form_button disabled" id="signInBtn" disabled>
                    Sign in
                </button>
                <p class="form_footer_text">
                    New to IdeaBoard?
                    <span> <a href="./signup.html" class="form_link">Create an account</a></span>
                </p>
            </div>
        </form>
    </main>

    <div id="footer_container"></div>
</body>

</html>
